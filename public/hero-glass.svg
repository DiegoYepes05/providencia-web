<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6e8" />
      <stop offset="0.45" stop-color="#f5e9c4" />
      <stop offset="1" stop-color="#efe0b0" />
    </linearGradient>

    <linearGradient id="deepTeal" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4a3208" />
      <stop offset="1" stop-color="#8b5f12" />
    </linearGradient>

    <linearGradient id="teal" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#e0b038" />
      <stop offset="1" stop-color="#d09828" />
    </linearGradient>

    <linearGradient id="mint" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f5e9c4" />
      <stop offset="1" stop-color="#ecd48a" />
    </linearGradient>

    <linearGradient id="frost" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f7f0dc" />
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#e8d9a8" />
      <stop offset="1" stop-color="#c9b06a" />
    </linearGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <filter id="panelShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="6" dy="16" stdDeviation="16" flood-color="#4a3208" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />

  <!-- diffuse halo behind the composition -->
  <ellipse cx="410" cy="330" rx="250" ry="150" fill="#e0b038" opacity="0.28" filter="url(#soften)" />

  <g filter="url(#panelShadow)">
    <!-- horizontal slabs that suggest depth -->
    <g opacity="0.85">
      <rect x="96" y="286" width="150" height="96" rx="6" fill="url(#mint)" opacity="0.72" transform="skewY(-6)" />
      <rect x="560" y="212" width="168" height="86" rx="6" fill="url(#mint)" opacity="0.6" transform="skewY(6)" />
      <rect x="566" y="330" width="146" height="80" rx="6" fill="url(#teal)" opacity="0.5" transform="skewY(4)" />
    </g>

    <!-- light back panel -->
    <rect x="214" y="126" width="306" height="252" rx="8" fill="url(#frost)" opacity="0.92" transform="skewY(-5)" />

    <!-- steel panel -->
    <rect x="402" y="150" width="128" height="238" rx="7" fill="url(#steel)" opacity="0.8" transform="skewY(-4)" />

    <!-- deep panel -->
    <rect x="236" y="176" width="150" height="226" rx="7" fill="url(#deepTeal)" opacity="0.88" transform="skewY(-3)" />

    <!-- bright vertical sheet, axis of the composition -->
    <rect x="356" y="128" width="58" height="316" rx="5" fill="url(#teal)" opacity="0.95" transform="skewY(-2)" />

    <!-- translucent front glass -->
    <rect x="300" y="300" width="196" height="118" rx="7" fill="url(#mint)" opacity="0.62" transform="skewY(3)" />
    <rect x="430" y="256" width="132" height="150" rx="7" fill="#ffffff" opacity="0.42" transform="skewY(2)" />
    <rect x="262" y="246" width="96" height="176" rx="6" fill="#ffffff" opacity="0.3" transform="skewY(-1)" />

    <!-- lit edges -->
    <g stroke="#ffffff" stroke-opacity="0.55" fill="none">
      <rect x="356" y="128" width="58" height="316" rx="5" transform="skewY(-2)" />
      <rect x="214" y="126" width="306" height="252" rx="8" stroke-opacity="0.35" transform="skewY(-5)" />
      <rect x="300" y="300" width="196" height="118" rx="7" stroke-opacity="0.4" transform="skewY(3)" />
    </g>

    <!-- highlight on the top edge -->
    <rect x="356" y="128" width="58" height="26" rx="5" fill="#ffffff" opacity="0.5" transform="skewY(-2)" />
  </g>
</svg>
